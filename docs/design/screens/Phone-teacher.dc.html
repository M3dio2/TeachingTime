<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lesson room on a phone, teacher</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Caveat:wght@500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 8px; display: flex; flex-direction: column; gap: 8px; background: #FAF6F0; color: #3B2A1E; font-family: Geist, system-ui, sans-serif; font-size: 16px; overflow: hidden">

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; flex: 0 0 auto">
<div style="position: relative; aspect-ratio: 16 / 9; background: #2E2620; border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center">
<span style="width: 44px; height: 44px; border-radius: 50%; background: #76604F; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600">A</span>
<span style="position: absolute; left: 6px; bottom: 6px; display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 6px; background: rgba(46, 38, 32, 0.85); color: #FFFFFF; font-size: 12px"><sc-if value="{{ muted }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="2" x2="22" y1="2" y2="22"></line><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"></path><path d="M5 10v2a7 7 0 0 0 12 5"></path><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"></path><path d="M9 9v3a3 3 0 0 0 5.12 2.12"></path><line x1="12" x2="12" y1="19" y2="22"></line></svg></sc-if>Anna</span>
</div>
<div style="position: relative; aspect-ratio: 16 / 9; background: #2E2620; border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center">
<span style="width: 44px; height: 44px; border-radius: 50%; background: #76604F; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600">L</span>
<span style="position: absolute; left: 6px; bottom: 6px; padding: 2px 6px; border-radius: 6px; background: rgba(46, 38, 32, 0.85); color: #FFFFFF; font-size: 12px">You</span>
</div>
</div>

<div style="flex: 1; min-height: 0; display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #E6D9C8; border-radius: 10px; overflow: hidden">
<div style="display: flex; align-items: center; gap: 10px; height: 44px; flex: 0 0 44px; padding: 0 10px; background: #F3EBE0; border-bottom: 1px solid #E6D9C8">
<button type="button" aria-label="Pause the audio" style="width: 28px; height: 28px; flex: 0 0 28px; padding: 0; border: 0; border-radius: 50%; background: #8B5E3C; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="14" y="4" width="4" height="16" rx="1"></rect><rect x="6" y="4" width="4" height="16" rx="1"></rect></svg></button>
<span style="font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 130px; min-width: 0">Dialogue 2 – Booking a massage.mp3</span>
<div style="position: relative; flex: 1; min-width: 40px; height: 4px; border-radius: 2px; background: #E6D9C8"><div style="position: absolute; left: 0; top: 0; bottom: 0; width: 32%; border-radius: 2px; background: #8B5E3C"></div><div style="position: absolute; top: 50%; left: 32%; width: 12px; height: 12px; margin: -6px 0 0 -6px; box-sizing: border-box; border-radius: 50%; background: #F4D35E; border: 2px solid #3B2A1E"></div></div>
<span style="font-size: 12px; color: #76604F; font-variant-numeric: tabular-nums; white-space: nowrap">0:42</span>
</div>

<nav aria-label="Open tabs" style="display: flex; align-items: center; gap: 6px; flex: 0 0 auto; padding: 8px 10px; border-bottom: 1px solid #E6D9C8">
<div style="flex: 1; min-width: 0; display: grid; grid-template-columns: {{ segCols }}; gap: 4px; padding: 3px; border-radius: 8px; background: #F3EBE0">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="2">
<div style="position: relative; display: flex; align-items: center; min-width: 0; height: 40px; border-radius: 6px; background: {{ t.bg }}">
<button type="button" aria-pressed="{{ t.on }}" onClick="{{ t.pick }}" style="flex: 1; min-width: 0; height: 40px; display: inline-flex; align-items: center; justify-content: center; padding: 0 4px 0 10px; border: 0; background: transparent; color: {{ t.color }}; font: inherit; font-size: 14px; font-weight: {{ t.weight }}; white-space: nowrap; overflow: hidden; cursor: pointer"><span style="overflow: hidden; text-overflow: ellipsis">{{ t.label }}</span></button>
<sc-if value="{{ t.canClose }}" hint-placeholder-val="{{ true }}"><button type="button" aria-label="{{ t.closeLabel }}" onClick="{{ t.close }}" style="width: 32px; height: 40px; flex: 0 0 32px; padding: 0; border: 0; background: transparent; color: #76604F; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></sc-if>
<sc-if value="{{ t.on }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="100" height="8" viewBox="0 0 100 8" preserveAspectRatio="none" style="position: absolute; left: 22%; bottom: 4px; width: 46%; height: 8px; pointer-events: none"><path d="M2 5 C 22 2, 48 7, 70 4 S 92 3, 98 5" fill="none" stroke="#F4D35E" stroke-width="4" stroke-linecap="round" vector-effect="non-scaling-stroke"></path></svg></sc-if>
</div>
</sc-for>
</div>
<sc-if value="{{ canAdd }}" hint-placeholder-val="{{ false }}">
<button type="button" aria-label="Open a second tab" title="Open a second tab" onClick="{{ addText }}" style="width: 44px; height: 44px; flex: 0 0 44px; padding: 0; border: 1px solid #E6D9C8; border-radius: 8px; background: #FFFFFF; color: #3B2A1E; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>
</sc-if>
</nav>

<div style="position: relative; flex: 1; min-height: 0">
<dc-import name="TabContent" kind="{{ activeKind }}" page-note="Anna sees page 1" pad-chip="Only you can write" hint-size="100%,100%"></dc-import>
</div>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 60px; flex: 0 0 60px; padding: 0 4px">
<button type="button" aria-label="Turn off your microphone" style="width: 48px; height: 48px; padding: 0; border: 1px solid #E6D9C8; border-radius: 8px; background: #FFFFFF; color: #3B2A1E; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" x2="12" y1="19" y2="22"></line></svg></button>
<button type="button" aria-label="Turn off your camera" style="width: 48px; height: 48px; padding: 0; border: 1px solid #E6D9C8; border-radius: 8px; background: #FFFFFF; color: #3B2A1E; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 8-6 4 6 4V8Z"></path><rect x="2" y="6" width="14" height="12" rx="2"></rect></svg></button>
<button type="button" aria-expanded="{{ filesOpen }}" onClick="{{ openFiles }}" style="display: inline-flex; align-items: center; gap: 6px; height: 48px; padding: 0 14px; border: 1px solid {{ filesBorder }}; border-radius: 8px; background: #FFFFFF; color: #3B2A1E; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"></path></svg>Files</button>
<button type="button" aria-label="More controls" aria-expanded="{{ moreOpen }}" onClick="{{ openMore }}" style="width: 48px; height: 48px; padding: 0; border: 1px solid {{ moreBorder }}; border-radius: 8px; background: #FFFFFF; color: #3B2A1E; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg></button>
<button type="button" aria-label="Leave the lesson" style="width: 56px; height: 48px; padding: 0; border: 0; border-radius: 8px; background: #B4442F; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" x2="9" y1="12" y2="12"></line></svg></button>
</div>

<sc-if value="{{ sheetOpen }}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column; justify-content: flex-end; background: rgba(46, 38, 32, 0.45)">
<button type="button" aria-label="Close" onClick="{{ closeSheet }}" style="flex: 1; border: 0; padding: 0; background: transparent; cursor: pointer"></button>
<div role="dialog" aria-label="{{ sheetTitle }}" style="display: flex; flex-direction: column; gap: 4px; max-height: 70%; box-sizing: border-box; padding: 8px 12px 20px; background: #FFFFFF; border-radius: 16px 16px 0 0; box-shadow: 0 -8px 24px rgba(59, 42, 30, 0.18)">
<span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #E6D9C8; margin: 2px 0 6px"></span>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px 6px">
<span style="font-size: 17px; font-weight: 600">{{ sheetTitle }}</span>
<button type="button" aria-label="Close" onClick="{{ closeSheet }}" style="width: 40px; height: 40px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: #76604F; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
</div>

<sc-if value="{{ filesOpen }}" hint-placeholder-val="{{ true }}">
<div style="overflow: auto; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column">
<span style="font-size: 13px; font-weight: 600; color: #76604F; padding: 0 4px 4px">PDFs</span>
<sc-for list="{{ pdfs }}" as="f" hint-placeholder-count="2">
<button type="button" onClick="{{ f.open }}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 4px; border: 0; border-radius: 8px; background: transparent; text-align: left; font: inherit; cursor: pointer">
<span style="width: 36px; height: 36px; flex: 0 0 36px; border-radius: 6px; background: #F3EBE0; color: #8B5E3C; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path><path d="M16 13H8"></path><path d="M16 17H8"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 500; color: #3B2A1E">{{ f.name }}</span><span style="font-size: 13px; color: #76604F">{{ f.meta }}</span></span>
<sc-if value="{{ f.on }}" hint-placeholder-val="{{ false }}"><span style="padding: 1px 6px; border-radius: 4px; background: #FBEDB5; color: #6B4E0E; font-size: 12px; font-weight: 500">On screen</span></sc-if>
</button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 0 4px">
<span style="font-size: 13px; font-weight: 600; color: #76604F">Pictures</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ pics }}" as="f" hint-placeholder-count="3">
<button type="button" onClick="{{ f.open }}" aria-label="{{ f.label }}" style="min-width: 0; padding: 0; border: 0; background: transparent; text-align: left; font: inherit; cursor: pointer">
<span style="display: flex; aspect-ratio: 1; border-radius: 6px; background: #F3EBE0; color: #76604F; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"></path></svg></span>
<span style="display: block; margin-top: 4px; font-size: 12px; color: #76604F; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ f.name }}</span>
</button>
</sc-for>
</div>
</div>
<span style="padding: 8px 4px 0; font-size: 13px; line-height: 1.45; color: {{ sheetHintColor }}">{{ sheetHint }}</span>
</div>
</sc-if>

<sc-if value="{{ moreOpen }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column">
<button type="button" onClick="{{ toggleMute }}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 4px; border: 0; background: transparent; text-align: left; font: inherit; font-size: 16px; color: #3B2A1E; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="2" x2="22" y1="2" y2="22"></line><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"></path><path d="M5 10v2a7 7 0 0 0 12 5"></path><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"></path><path d="M9 9v3a3 3 0 0 0 5.12 2.12"></path><line x1="12" x2="12" y1="19" y2="22"></line></svg>{{ muteLabel }}</button>
<button type="button" role="switch" aria-checked="{{ canEdit }}" onClick="{{ toggleEdit }}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 4px; border: 0; border-top: 1px solid #E6D9C8; background: transparent; text-align: left; font: inherit; font-size: 16px; color: #3B2A1E; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg><span style="flex: 1">Anna can write and draw</span><span style="position: relative; width: 44px; height: 26px; border-radius: 13px; background: {{ switchBg }}"><span style="position: absolute; top: 3px; left: {{ knobLeft }}; width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF"></span></span></button>
<button type="button" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 4px; border: 0; border-top: 1px solid #E6D9C8; background: transparent; text-align: left; font: inherit; font-size: 16px; color: #3B2A1E; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>Just talk</button>
<span style="padding: 8px 4px 0; font-size: 13px; line-height: 1.45; color: #76604F">Screen sharing and side by side need a computer.</span>
</div>
</sc-if>
</div>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sheet":{"editor":"enum","options":["none","files","more"],"default":"files"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const s = this.state || {};
    const sheet = s.sheet ?? (p.sheet ?? 'files');
    const tabs = s.tabs ?? ['pdf-menu', 'text'];
    const active = s.active ?? 0;
    const muted = !!s.muted;
    const canEdit = !!s.canEdit;
    const LABEL = { text: 'Text', draw: 'Draw', 'pdf-menu': 'Spa menu.pdf', 'pdf-dialogue': 'Booking dialogue.pdf', 'pic-towels': 'towels.jpg', 'pic-reception': 'reception.jpg', 'pic-room': 'massage-room.jpg' };
    const kindOf = (id) => id.indexOf('pic-') === 0 ? 'picture' : id;
    const full = tabs.length >= 2;
    const open = (id) => {
      const t = tabs.slice();
      const at = t.indexOf(id);
      if (at !== -1) { this.setState({ active: at, sheet: 'none' }); return; }
      if (full) { this.setState({ fullHint: true }); return; }
      t.push(id);
      this.setState({ tabs: t, active: t.length - 1, sheet: 'none', fullHint: false });
    };
    return {
      segCols: full ? 'repeat(2, minmax(0, 1fr))' : 'minmax(0, 1fr)',
      canAdd: !full,
      addText: () => {
        const id = tabs.indexOf('text') === -1 ? 'text' : 'draw';
        this.setState({ tabs: tabs.concat([id]), active: tabs.length });
      },
      sheetHint: full ? 'Two tabs are open. Close one with its × to show a file.' : 'Tap a file to show it to Anna. It opens as a second tab.',
      sheetHintColor: (full && s.fullHint) ? '#3B2A1E' : '#76604F',
      tabs: tabs.map((id, i) => ({
        label: LABEL[id],
        on: i === active,
        bg: i === active ? '#FFFFFF' : 'transparent',
        color: i === active ? '#3B2A1E' : '#76604F',
        weight: i === active ? '600' : '500',
        pick: () => this.setState({ active: i }),
        canClose: full,
        closeLabel: 'Close ' + LABEL[id],
        close: () => this.setState({ tabs: tabs.filter((x, j) => j !== i), active: 0, fullHint: false })
      })),
      activeKind: kindOf(tabs[active]),
      sheetOpen: sheet !== 'none',
      filesOpen: sheet === 'files',
      moreOpen: sheet === 'more',
      sheetTitle: sheet === 'more' ? 'Lesson controls' : "Anna's files",
      filesBorder: sheet === 'files' ? '#8B5E3C' : '#E6D9C8',
      moreBorder: sheet === 'more' ? '#8B5E3C' : '#E6D9C8',
      openFiles: () => this.setState({ sheet: 'files' }),
      openMore: () => this.setState({ sheet: 'more' }),
      closeSheet: () => this.setState({ sheet: 'none' }),
      pdfs: [
        { id: 'pdf-menu', meta: '3 pages' },
        { id: 'pdf-dialogue', meta: '2 pages' }
      ].map((f) => ({ name: LABEL[f.id], meta: f.meta, on: tabs[active] === f.id, open: () => open(f.id) })),
      pics: ['pic-towels', 'pic-reception', 'pic-room'].map((id) => ({ name: LABEL[id], label: 'Show ' + LABEL[id], open: () => open(id) })),
      muted: muted,
      muteLabel: muted ? 'Unmute Anna' : 'Mute Anna',
      toggleMute: () => this.setState({ muted: !muted }),
      canEdit: canEdit,
      toggleEdit: () => this.setState({ canEdit: !canEdit }),
      switchBg: canEdit ? '#52703F' : '#E6D9C8',
      knobLeft: canEdit ? '21px' : '3px'
    };
  }
}
</script>
</body>
</html>
