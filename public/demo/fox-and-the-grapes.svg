<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <title>The fox and the grapes</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde7c4"/>
      <stop offset="1" stop-color="#fbf3e4"/>
    </linearGradient>
    <radialGradient id="grape" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#a98bd6"/>
      <stop offset="1" stop-color="#5b3d8f"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="1030" cy="150" r="70" fill="#f6c453"/>
  <!-- hills -->
  <path d="M0 600 C 250 520 450 560 650 590 C 850 620 1000 540 1200 560 L1200 800 L0 800 Z" fill="#c9dba4"/>
  <path d="M0 660 C 300 620 600 690 900 660 C 1050 645 1130 650 1200 660 L1200 800 L0 800 Z" fill="#a9c57f"/>
  <!-- trellis -->
  <g stroke="#8a5a34" stroke-width="16" stroke-linecap="round">
    <line x1="560" y1="660" x2="560" y2="170"/>
    <line x1="1060" y1="660" x2="1060" y2="170"/>
    <line x1="540" y1="180" x2="1080" y2="180"/>
  </g>
  <!-- vine and leaves -->
  <path d="M560 200 C 650 240 720 170 810 210 C 900 250 960 180 1060 205" fill="none" stroke="#4f7a32" stroke-width="10"/>
  <g fill="#6c9a43">
    <path d="M640 215 q 30 -45 70 -10 q -30 45 -70 10z"/>
    <path d="M760 200 q 40 -40 75 0 q -35 40 -75 0z"/>
    <path d="M900 225 q 30 -45 70 -10 q -30 45 -70 10z"/>
    <path d="M990 200 q 35 -40 70 0 q -35 40 -70 0z"/>
  </g>
  <!-- grapes -->
  <g fill="url(#grape)">
    <g transform="translate(700 240)">
      <circle cx="0" cy="0" r="22"/><circle cx="40" cy="0" r="22"/><circle cx="-40" cy="0" r="22"/>
      <circle cx="20" cy="36" r="22"/><circle cx="-20" cy="36" r="22"/>
      <circle cx="0" cy="72" r="22"/><circle cx="40" cy="72" r="20"/>
      <circle cx="20" cy="106" r="20"/>
    </g>
    <g transform="translate(900 250)">
      <circle cx="0" cy="0" r="22"/><circle cx="40" cy="0" r="22"/><circle cx="-40" cy="0" r="22"/>
      <circle cx="20" cy="36" r="22"/><circle cx="-20" cy="36" r="22"/>
      <circle cx="0" cy="72" r="22"/><circle cx="-38" cy="70" r="20"/>
      <circle cx="-16" cy="104" r="20"/>
    </g>
  </g>
  <!-- fox, jumping -->
  <g transform="translate(330 420) rotate(-18)">
    <path d="M-170 40 C -260 10 -300 -70 -250 -110 C -230 -60 -190 -20 -120 0 Z" fill="#e07b2e"/>
    <path d="M-255 -100 C -275 -80 -275 -55 -250 -50 C -240 -70 -240 -90 -255 -100Z" fill="#fff"/>
    <ellipse cx="0" cy="20" rx="150" ry="70" fill="#e8873a"/>
    <ellipse cx="10" cy="50" rx="95" ry="35" fill="#fbe3c8"/>
    <path d="M110 -20 C 160 -60 230 -50 260 -10 C 230 20 170 40 120 30 Z" fill="#e8873a"/>
    <path d="M250 -12 C 270 -8 285 0 285 8 C 270 14 255 12 245 6 Z" fill="#3b2a20"/>
    <path d="M150 -50 L 170 -115 L 200 -55 Z" fill="#e8873a"/>
    <path d="M165 -60 L 172 -95 L 188 -60 Z" fill="#3b2a20"/>
    <circle cx="205" cy="-22" r="8" fill="#3b2a20"/>
    <path d="M190 10 C 210 22 235 22 250 10" fill="#fff"/>
    <g stroke="#c9631f" stroke-width="26" stroke-linecap="round">
      <line x1="90" y1="60" x2="160" y2="120"/>
      <line x1="60" y1="70" x2="110" y2="140"/>
      <line x1="-90" y1="60" x2="-160" y2="120"/>
      <line x1="-60" y1="70" x2="-120" y2="140"/>
    </g>
  </g>
  <text x="60" y="110" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#3b2a20">The Fox and the Grapes</text>
  <text x="62" y="160" font-family="Georgia, serif" font-size="30" fill="#6b5442">What did the fox do? What did he say?</text>
</svg>
